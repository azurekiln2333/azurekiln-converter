<!DOCTYPE html>
<html class="light" lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="description" content="AzureKiln 离线转换器常见问题：隐私、文件大小限制、转换速度、浏览器兼容性等。" />
  <title>常见问题 - AzureKiln Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet" />
  <script src="assets/tailwind.js"></script>
  <script src="assets/tailwind.config.js"></script>
  <link href="assets/css/site.css" rel="stylesheet" />
</head>

<body class="bg-[#f7f9fb] dark:bg-slate-950 text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed">

  <div id="ak-header"></div>

  <main class="pt-0">

    <section class="relative px-8 pt-16 pb-8 flex flex-col items-center text-center max-w-7xl mx-auto">
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[700px] h-[300px] bg-gradient-to-b from-primary/5 to-transparent rounded-full blur-3xl -z-10"></div>
      <span class="font-label text-xs tracking-[0.2em] text-primary mb-5 block uppercase">FAQ</span>
      <h1 class="font-headline text-3xl md:text-5xl font-extrabold tracking-tighter text-on-surface mb-5">常见问题</h1>
      <p class="text-secondary max-w-2xl leading-relaxed">关于隐私、限制与使用方法的常见疑问。</p>
    </section>

    <section class="px-8 py-8 max-w-4xl mx-auto" id="faq-list"></section>

    <!-- ── 联系反馈 ──────────────────────────────── -->
    <section class="px-8 py-12 max-w-4xl mx-auto">
      <div class="bg-surface-container-low/60 rounded-[2.5rem] border border-outline-variant/10 p-10 text-center">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-primary/5 flex items-center justify-center text-[#005ab7] mb-4">
          <span class="material-symbols-outlined text-[28px]">contact_support</span>
        </div>
        <h2 class="font-headline text-xl font-bold text-on-surface mb-3">没有找到答案？</h2>
        <p class="text-sm text-secondary leading-relaxed mb-6 max-w-lg mx-auto">
          欢迎前往主站联系我们页面反馈问题或提出建议，我们会尽快回复。</p>
        <a href="https://azurekiln.cn/contact.php"
          class="px-6 py-3 rounded-full bg-[#005ab7] text-white font-bold text-sm hover:opacity-90 transition-all inline-flex items-center gap-2">
          <span class="material-symbols-outlined text-base" data-icon="send">send</span> 联系我们
        </a>
      </div>
    </section>

  </main>

  <div id="ak-footer"></div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AK_SITE.renderHeader('faq');
      AK_SITE.renderFooter();
      document.getElementById('faq-list').innerHTML = AK_FAQ.map(([q, a], i) => `
        <details class="group bg-surface-container-lowest rounded-2xl border border-outline-variant/20 mb-4 open:border-primary/30 open:shadow-lg open:shadow-primary/5 transition-all"
          ${i === 0 ? 'open' : ''}>
          <summary class="flex items-center justify-between gap-4 px-6 py-5 cursor-pointer list-none select-none">
            <span class="font-bold text-on-surface text-[15px] flex items-center gap-3">
              <span class="material-symbols-outlined text-[20px] text-[#005ab7]">help</span>${q}
            </span>
            <span class="material-symbols-outlined text-[20px] text-outline ak-faq-chevron shrink-0">expand_more</span>
          </summary>
          <div class="px-6 pb-5 pt-3.5 text-sm text-secondary leading-loose border-t border-outline-variant/10 mt-2">${a}</div>
        </details>`).join('');
    });
  </script>
</body>

</html>
